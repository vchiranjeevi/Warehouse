name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # Build Quarkus app as uber-jar (single jar, no lib/app folders)
      - name: Build Quarkus app
        run: ./mvnw clean package -Dquarkus.package.type=uber-jar -X

      - name: Show target contents
        run: ls -R $GITHUB_WORKSPACE

      # Build Docker image using the simplified Dockerfile
      - name: Build Docker image
        run: docker build -f src/main/docker/Dockerfile.jvm -t myorg/warehouse-api:${{ github.sha }} ${GITHUB_WORKSPACE}

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push myorg/warehouse-api:${{ github.sha }}
