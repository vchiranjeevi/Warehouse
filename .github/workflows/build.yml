name: Build and Dockerize

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build with Maven (uber-jar)
        run: ./mvnw clean package -Dquarkus.package.type=uber-jar

      - name: Show target contents
        run: ls -lh target

      - name: Build Docker image
        run: docker build -f src/main/docker/Dockerfile.jvm -t myorg/warehouse-api:${{ github.sha }} .
