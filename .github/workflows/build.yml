name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # 👇 This step ensures target/quarkus-app/ exists
      - name: Build Quarkus app
        run: ./mvnw clean package -Dquarkus.package.type=fast-jar

      - name: Build Docker image
        run: docker build -f src/main/docker/Dockerfile.jvm -t myorg/warehouse-api:${{ github.sha }} .

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push myorg/warehouse-api:${{ github.sha }}
